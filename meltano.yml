version: 1
send_anonymous_usage_stats: true
project_id: 699e335d-5053-449a-9609-4dfe16e4da69
plugins:
  extractors:
  - name: tap-sumologic
    namespace: tap_sumologic
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    settings:
    - name: access_id
      kind: password
    - name: access_key
      kind: password
    - name: start_date
      kind: string
    - name: end_date
      kind: string
    - name: time_zone
      kind: string
    - name: tables
      kind: array
    config:
      tables:
      - table_name: example_table_name
        query_result_type: records
        query: >
          *
          | count by _collector
      # Example metrics query with parameterized cluster_name
      # - table_name: cluster_cpu_metrics
      #   query_type: metrics
      #   query: >
      #     metric=aggregate:kube_resource_requests:pod:cpu cluster={cluster_name}
      #     | quantize to 1h using avg | avg by namespace
      #   query_params:
      #     cluster_name: my-cluster-name
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
environments:
  - name: default
default_environment: default
